name: Web Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'web-v*.*.*'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要创建 release 并上传 web-dist.zip
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/web-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/web-v}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/resourcer-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/resourcer-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 服务端会托管网页端并支持在线自更新，所以除了镜像之外
      # 还要把构建产物作为 release asset 发出去
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dist for self-update
        run: |
          cd web
          npm ci
          npm run build
          # 写入版本号，服务端据此判断有没有新版
          printf '{"version":"%s"}\n' "${{ steps.version.outputs.version }}" > dist/version.json
          cd dist && zip -qr ../../web-dist.zip . && cd ..
          echo "zip: $(du -h ../web-dist.zip | cut -f1)"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/web-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Web ${{ steps.version.outputs.version }}" \
            --notes "网页端 ${{ steps.version.outputs.version }}" \
            web-dist.zip \
            || gh release upload "${GITHUB_REF#refs/tags/}" web-dist.zip --clobber
