name: Web Release

# 网页端由服务端（re-sourcer）直接托管，不再单独发 Docker 镜像。
# 这里只负责构建 dist 并作为 release asset 发布，服务端在设置页点击更新即可拉取。

on:
  workflow_dispatch:
  push:
    tags:
      - 'web-v*.*.*'

jobs:
  release:
    name: Build & Publish web-dist.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要创建 release 并上传 web-dist.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/web-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/web-v}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build dist
        run: |
          cd web
          npm ci
          npm run build
          # 写入版本号，服务端据此判断有没有新版
          printf '{"version":"%s"}\n' "${{ steps.version.outputs.version }}" > dist/version.json
          cd dist && zip -qr ../../web-dist.zip . && cd ..
          echo "zip: $(du -h ../web-dist.zip | cut -f1)"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/web-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "Web ${{ steps.version.outputs.version }}" \
            --notes "网页端 ${{ steps.version.outputs.version }}" \
            web-dist.zip \
            || gh release upload "${GITHUB_REF#refs/tags/}" web-dist.zip --clobber
