name: iOS Release

# 频道说明:
#   dev  : Ad Hoc 签名 → 蒲公英(需设备 UDID 在描述文件白名单内)
#   beta : App Store 签名 → TestFlight 内部测试(团队成员装 TestFlight 即可,无需 UDID)
#   prod : 暂无独立流程。App Store 提审是在 App Store Connect 里选一个已上传的 TestFlight build 提交,手动操作
#
# 触发方式:
#   tag ios-vX.Y.Z-dev  → dev
#   tag ios-vX.Y.Z      → beta(也可用 ios-vX.Y.Z-beta)
#   手动 workflow_dispatch → 选择频道

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布频道'
        required: true
        default: beta
        type: choice
        options:
          - dev
          - beta
  push:
    tags:
      - 'ios-v*'

env:
  BUNDLE_ID: app.resourcer.apple
  TEAM_ID: 925YHK2R4K

jobs:
  resolve:
    name: Resolve channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "${{ github.ref_name }}" == *-dev ]]; then
            CHANNEL=dev
          else
            CHANNEL=beta
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL (ref: ${{ github.ref_name }})"

  build:
    name: Build iOS IPA (${{ needs.resolve.outputs.channel }})
    needs: resolve
    runs-on: macos-26
    environment: iOS-CICD-IPA-Release-Testing-Build
    env:
      CHANNEL: ${{ needs.resolve.outputs.channel }}
      # 构建号必须在同一 MARKETING_VERSION 下单调递增,TestFlight 会拒绝重复的 build 号
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import signing credentials
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          # dev 用 Ad Hoc 描述文件,beta 用 App Store 描述文件;两者绑定同一个 Apple Distribution 证书
          IOS_PROVISION_PROFILE_BASE64: ${{ needs.resolve.outputs.channel == 'dev' && secrets.IOS_PROVISION_PROFILE_BASE64 || secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_PROVISION_PROFILE_BASE64" ]; then
            if [ "$CHANNEL" = "dev" ]; then
              echo "::error::缺少 secret IOS_PROVISION_PROFILE_BASE64(Ad Hoc 描述文件)"
            else
              echo "::error::缺少 secret IOS_APPSTORE_PROFILE_BASE64(App Store 描述文件)"
            fi
            exit 1
          fi

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PROVISION_PATH=$RUNNER_TEMP/provision.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROVISION_PATH

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PP_PLIST=$RUNNER_TEMP/provision.plist
          security cms -D -i $PROVISION_PATH > $PP_PLIST
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $PP_PLIST)
          PP_APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $PP_PLIST)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROVISION_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' $PP_PLIST)  AppID: $PP_APPID"

          # 提前校验描述文件与 Bundle ID 匹配,否则 archive 阶段报错很难读
          # 通配符 App ID(如 TEAM.* / TEAM.app.resourcer.*)对 Ad Hoc 可用,TestFlight 必须是精确 App ID
          case "$TEAM_ID.$BUNDLE_ID" in
            $PP_APPID) ;;
            *)
              echo "::error::描述文件的 App ID ($PP_APPID) 与 Bundle ID ($TEAM_ID.$BUNDLE_ID) 不匹配,请重新生成描述文件"
              exit 1 ;;
          esac
          if [ "$CHANNEL" != "dev" ] && [[ "$PP_APPID" == *'*'* ]]; then
            echo "::error::beta 频道需要精确 App ID 的描述文件,当前是通配符 ($PP_APPID),TestFlight 会拒收"
            exit 1
          fi

          # 描述文件类型与频道必须匹配:Ad Hoc 含 ProvisionedDevices,App Store 不含
          HAS_DEVICES=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' $PP_PLIST >/dev/null 2>&1 && echo yes || echo no)
          if [ "$CHANNEL" = "dev" ] && [ "$HAS_DEVICES" = "no" ]; then
            echo "::error::dev 频道需要 Ad Hoc 描述文件,但当前描述文件不含设备白名单(是 App Store 类型)"
            exit 1
          fi
          if [ "$CHANNEL" != "dev" ] && [ "$HAS_DEVICES" = "yes" ]; then
            echo "::error::beta 频道需要 App Store 描述文件,但当前描述文件含设备白名单(是 Ad Hoc 类型),TestFlight 会拒收"
            exit 1
          fi

      - name: Configure manual signing
        run: |
          PROJECT_FILE="iOS/ReSourcer.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PROJECT_FILE"
          # 描述文件通过 xcodebuild 命令行参数 PROVISIONING_PROFILE_SPECIFIER 指定,无需改 pbxproj

      - name: Create ExportOptions.plist
        run: |
          if [ "$CHANNEL" = "dev" ]; then
            METHOD=release-testing
          else
            METHOD=app-store-connect
          fi
          cat > iOS/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${METHOD}</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PP_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat iOS/ExportOptions.plist

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iOS/ReSourcer.xcodeproj \
            -scheme ReSourcer \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ReSourcer.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PP_UUID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee /tmp/archive.log | tail -30

          if [ ! -d "$RUNNER_TEMP/ReSourcer.xcarchive" ]; then
            echo "Archive failed. Full log:"
            cat /tmp/archive.log
            exit 1
          fi

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ReSourcer.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist iOS/ExportOptions.plist \
            2>&1 | tee /tmp/export.log | tail -20

          if [ ! -d "$RUNNER_TEMP/export" ]; then
            echo "Export failed. Full log:"
            cat /tmp/export.log
            exit 1
          fi

      - name: Prepare IPA
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"
            ls -R $RUNNER_TEMP/export/
            exit 1
          fi
          cp "$IPA_PATH" ReSourcer.ipa
          echo "IPA size: $(du -h ReSourcer.ipa | cut -f1)"

      - name: Diagnose embedded provisioning profile
        run: |
          # 解包 IPA,导出内嵌描述文件,打印类型/过期时间/设备白名单
          unzip -o ReSourcer.ipa -d "$RUNNER_TEMP/ipa_check" >/dev/null
          APP_DIR=$(find "$RUNNER_TEMP/ipa_check/Payload" -maxdepth 1 -name "*.app" -type d | head -n 1)
          PP="$APP_DIR/embedded.mobileprovision"

          if [ ! -f "$PP" ]; then
            echo "::warning::未找到 embedded.mobileprovision,IPA 可能未正确签名"
            exit 0
          fi

          PP_PLIST="$RUNNER_TEMP/pp.plist"
          security cms -D -i "$PP" > "$PP_PLIST"

          echo "===== 内嵌描述文件诊断 ====="
          echo "Channel:     $CHANNEL"
          echo "Version:     $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist" 2>/dev/null || echo '?') ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist" 2>/dev/null || echo '?'))"
          echo "Bundle ID:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Info.plist" 2>/dev/null || echo '?')"
          echo "Name:        $(/usr/libexec/PlistBuddy -c 'Print :Name' "$PP_PLIST" 2>/dev/null || echo '?')"
          echo "AppIDName:   $(/usr/libexec/PlistBuddy -c 'Print :AppIDName' "$PP_PLIST" 2>/dev/null || echo '?')"
          echo "Expiration:  $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PP_PLIST" 2>/dev/null || echo '?')"
          echo "get-task-allow: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PP_PLIST" 2>/dev/null || echo '(未设置)')"

          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PP_PLIST" >/dev/null 2>&1; then
            DEVICE_COUNT=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PP_PLIST" 2>/dev/null | grep -cE '^\s+[0-9a-fA-F-]+$' || echo 0)
            echo "分发类型:    Ad Hoc / Development(含设备白名单)"
            echo "设备数量:    $DEVICE_COUNT"
            echo "----- 设备 UDID 列表 -----"
            /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PP_PLIST" 2>/dev/null
            echo "提示:安装的设备 UDID 必须在上面列表中,否则会报「完整性无法验证」"
          else
            echo "分发类型:    App Store / TestFlight(无设备白名单,只能通过 TestFlight 安装)"
          fi
          echo "==========================="

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ReSourcer.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: env.CHANNEL != 'dev'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::缺少 App Store Connect API 凭证 secret:ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8"
            exit 1
          fi
          # altool 会在 ~/private_keys 下按 AuthKey_<KEY_ID>.p8 查找私钥
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

          xcrun altool --upload-app --type ios \
            --file ReSourcer.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --output-format json 2>&1 | tee /tmp/altool.log

          if grep -q '"product-errors"' /tmp/altool.log; then
            echo "::error::TestFlight 上传失败,见上方日志"
            exit 1
          fi
          echo "已上传到 App Store Connect,处理完成后(约 5-15 分钟)会出现在 TestFlight 内部测试组"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf ~/private_keys || true

  upload-pgyer:
    name: Upload to Pgyer
    needs: [resolve, build]
    runs-on: ubuntu-latest
    if: needs.build.result == 'success' && needs.resolve.outputs.channel == 'dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate update description
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD 2>/dev/null | head -20)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS=$(git log --pretty=format:"- %s" -20)
          fi

          DESCRIPTION=""
          if [ -n "$OPENAI_API_KEY" ]; then
            PROMPT="Summarize these git commits into a brief Chinese changelog (3-5 bullet points, focus on user-facing changes):

            ${COMMITS}

            Output plain text, no markdown, no headers. Each line starts with •"

            RESPONSE=$(curl -sf https://api.openai.com/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d "$(jq -n --arg prompt "$PROMPT" '{
                "model": "gpt-4.1-mini",
                "messages": [{"role": "user", "content": $prompt}],
                "max_tokens": 512,
                "temperature": 0.3
              }')" 2>/dev/null || true)

            if [ -n "$RESPONSE" ]; then
              DESCRIPTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
            fi
          fi

          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="$COMMITS"
          fi

          echo "$DESCRIPTION" > /tmp/pgyer_desc.txt

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts

      - name: Upload to Pgyer
        run: |
          DESCRIPTION=$(cat /tmp/pgyer_desc.txt)
          curl -F "_api_key=${{ secrets.PGYER_API_KEY }}" \
               -F "file=@artifacts/ReSourcer.ipa" \
               -F "buildUpdateDescription=${DESCRIPTION}" \
               https://www.pgyer.com/apiv2/app/upload
