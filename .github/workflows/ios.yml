name: iOS Release

# tag ios-vX.Y.Z → App Store 签名 → 上传 TestFlight
# App Store 提审是在 App Store Connect 里选一个已上传的 TestFlight build 提交,手动操作

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

env:
  # 切换开发者账号时改这三行,并替换 environment 下的全部 secret
  BUNDLE_ID: app.resourcer.apple
  SHARE_BUNDLE_ID: app.resourcer.apple.share
  TEAM_ID: 925YHK2R4K

jobs:
  build:
    name: Build and upload to TestFlight
    runs-on: macos-26
    environment: iOS-CICD-IPA-Release-Testing-Build
    env:
      # 构建号必须在同一 MARKETING_VERSION 下单调递增,TestFlight 会拒绝重复的 build 号
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import signing credentials
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_APPSTORE_SHARE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_SHARE_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$IOS_APPSTORE_PROFILE_BASE64" ]; then
            echo "::error::缺少 secret IOS_APPSTORE_PROFILE_BASE64(App Store 描述文件)"
            exit 1
          fi

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PROVISION_PATH=$RUNNER_TEMP/provision.mobileprovision
          SHARE_PROVISION_PATH=$RUNNER_TEMP/provision-share.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode -o $PROVISION_PATH

          # Share Extension profile: prefer dedicated secret; else download via ASC API
          export SHARE_PROVISION_PATH
          if [ -n "$IOS_APPSTORE_SHARE_PROFILE_BASE64" ]; then
            echo -n "$IOS_APPSTORE_SHARE_PROFILE_BASE64" | base64 --decode -o "$SHARE_PROVISION_PATH"
          else
            if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
              echo "::error::缺少 IOS_APPSTORE_SHARE_PROFILE_BASE64，且无 ASC API 凭证可自动拉取 Share Extension 描述文件"
              exit 1
            fi
            echo "IOS_APPSTORE_SHARE_PROFILE_BASE64 未设置，通过 App Store Connect API 拉取 $SHARE_BUNDLE_ID App Store profile…"
            python3 -m venv "$RUNNER_TEMP/asc-venv"
            # shellcheck disable=SC1091
            source "$RUNNER_TEMP/asc-venv/bin/activate"
            pip install --quiet PyJWT cryptography
            python3 - <<'PY'
          import base64, json, os, sys, time, urllib.error, urllib.parse, urllib.request
          import jwt

          key_id = os.environ["ASC_API_KEY_ID"]
          issuer = os.environ["ASC_API_ISSUER_ID"]
          bundle = os.environ["SHARE_BUNDLE_ID"]
          out_path = os.environ["SHARE_PROVISION_PATH"]
          private_key = os.environ["ASC_API_KEY_P8"]
          app_group = "group.app.resourcer.apple"
          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer, "iat": now, "exp": now + 20 * 60, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          if isinstance(token, bytes):
              token = token.decode()

          def asc_request(method: str, path_query: str, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com{path_query}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      **({"Content-Type": "application/json"} if body is not None else {}),
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8", errors="replace")
                  print(f"::error::ASC API {e.code} {method} {path_query}: {err_body}", file=sys.stderr)
                  sys.exit(1)

          def asc_get(path_query: str):
              return asc_request("GET", path_query)

          q = urllib.parse.urlencode({"filter[identifier]": bundle})
          bundles = asc_get(f"/v1/bundleIds?{q}").get("data") or []
          if not bundles:
              print(f"Creating Bundle ID {bundle}…")
              created = asc_request(
                  "POST",
                  "/v1/bundleIds",
                  {
                      "data": {
                          "type": "bundleIds",
                          "attributes": {
                              "identifier": bundle,
                              "name": "ReSourcer Share Extension",
                              "platform": "IOS",
                          },
                      }
                  },
              )
              bundles = [created["data"]]
          bundle_id = bundles[0]["id"]
          print(f"Share Bundle ID resource: {bundle_id}")

          # Ensure App Groups capability (needed for entitlements)
          caps = asc_get(f"/v1/bundleIds/{bundle_id}/bundleIdCapabilities").get("data") or []
          has_groups = any(
              (c.get("attributes") or {}).get("capabilityType") == "APP_GROUPS" for c in caps
          )
          if not has_groups:
              print(f"Enabling APP_GROUPS ({app_group}) on Share Bundle ID…")
              asc_request(
                  "POST",
                  "/v1/bundleIdCapabilities",
                  {
                      "data": {
                          "type": "bundleIdCapabilities",
                          "attributes": {
                              "capabilityType": "APP_GROUPS",
                              "settings": [
                                  {
                                      "key": "APP_GROUP_IDENTIFIERS",
                                      "options": [{"key": app_group, "enabled": True}],
                                  }
                              ],
                          },
                          "relationships": {
                              "bundleId": {"data": {"type": "bundleIds", "id": bundle_id}}
                          },
                      }
                  },
              )

          profiles = asc_get(f"/v1/bundleIds/{bundle_id}/profiles?limit=50").get("data") or []
          store = [
              p for p in profiles
              if (p.get("attributes") or {}).get("profileType") == "IOS_APP_STORE"
          ]
          active = [p for p in store if (p.get("attributes") or {}).get("profileState") == "ACTIVE"]
          candidates = active or store
          if not candidates:
              print("No App Store profile for Share Extension; creating one…")
              certs = asc_get(
                  "/v1/certificates?filter[certificateType]=DISTRIBUTION&limit=50"
              ).get("data") or []
              # Also try IOS_DISTRIBUTION naming used by some accounts
              if not certs:
                  certs = asc_get(
                      "/v1/certificates?filter[certificateType]=IOS_DISTRIBUTION&limit=50"
                  ).get("data") or []
              if not certs:
                  print(
                      "::error::找不到 Apple Distribution 证书，无法自动创建 Share Extension profile。"
                      "请在 developer.apple.com 创建 App Store profile，"
                      "并设置 secret IOS_APPSTORE_SHARE_PROFILE_BASE64。",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              cert_id = certs[0]["id"]
              created_profile = asc_request(
                  "POST",
                  "/v1/profiles",
                  {
                      "data": {
                          "type": "profiles",
                          "attributes": {
                              "name": "ReSourcer Share App Store",
                              "profileType": "IOS_APP_STORE",
                          },
                          "relationships": {
                              "bundleId": {"data": {"type": "bundleIds", "id": bundle_id}},
                              "certificates": {
                                  "data": [{"type": "certificates", "id": cert_id}]
                              },
                          },
                      }
                  },
              )
              candidates = [created_profile["data"]]

          candidates.sort(
              key=lambda p: (p.get("attributes") or {}).get("createdDate") or "",
              reverse=True,
          )
          profile = candidates[0]
          content_b64 = (profile.get("attributes") or {}).get("profileContent")
          if not content_b64:
              detail = asc_get(f"/v1/profiles/{profile['id']}")
              content_b64 = (detail.get("data", {}).get("attributes") or {}).get("profileContent")
          if not content_b64:
              print("::error::ASC profile 响应缺少 profileContent", file=sys.stderr)
              sys.exit(1)
          raw = base64.b64decode(content_b64)
          with open(out_path, "wb") as f:
              f.write(raw)
          name = (profile.get("attributes") or {}).get("name")
          print(f"Downloaded Share profile via ASC: {name} ({len(raw)} bytes)")
          PY
            deactivate || true
          fi

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          install_and_validate_profile() {
            local path="$1"
            local expected_bundle="$2"
            local env_uuid_key="$3"
            local plist=$RUNNER_TEMP/provision-$(basename "$path").plist
            security cms -D -i "$path" > "$plist"
            local uuid appid
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$plist")
            appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$plist")
            cp "$path" ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision
            echo "${env_uuid_key}=$uuid" >> $GITHUB_ENV
            echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")  AppID: $appid"

            if [ "$appid" != "$TEAM_ID.$expected_bundle" ]; then
              echo "::error::描述文件的 App ID ($appid) 与 Bundle ID ($TEAM_ID.$expected_bundle) 不匹配。TestFlight 需要精确 App ID 的 App Store 描述文件,通配符不可用。"
              exit 1
            fi
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" >/dev/null 2>&1; then
              echo "::error::描述文件含设备白名单(Ad Hoc 类型),TestFlight 会拒收。请改用 App Store 类型描述文件。"
              exit 1
            fi
          }

          install_and_validate_profile "$PROVISION_PATH" "$BUNDLE_ID" "PP_UUID"
          install_and_validate_profile "$SHARE_PROVISION_PATH" "$SHARE_BUNDLE_ID" "SHARE_PP_UUID"

      - name: Configure manual signing
        run: |
          PROJECT_FILE="iOS/ReSourcer.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PROJECT_FILE"
          # 按 Bundle ID 写入各 target 的 PROVISIONING_PROFILE_SPECIFIER（主 App + Share Extension）
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("iOS/ReSourcer.xcodeproj/project.pbxproj")
          text = path.read_text()
          mapping = {
              os.environ["BUNDLE_ID"]: os.environ["PP_UUID"],
              os.environ["SHARE_BUNDLE_ID"]: os.environ["SHARE_PP_UUID"],
          }
          def inject(match: re.Match) -> str:
              block = match.group(0)
              m = re.search(r"PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);", block)
              if not m:
                  return block
              bundle = m.group(1).strip()
              uuid = mapping.get(bundle)
              if not uuid:
                  return block
              if "PROVISIONING_PROFILE_SPECIFIER" in block:
                  return re.sub(
                      r"PROVISIONING_PROFILE_SPECIFIER = [^;]+;",
                      f"PROVISIONING_PROFILE_SPECIFIER = {uuid};",
                      block,
                  )
              return block.replace(
                  f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};",
                  f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {uuid};",
              )
          text2, n = re.subn(
              r"/\* (Debug|Release) \*/ = \{\n\t\t\tisa = XCBuildConfiguration;\n\t\t\tbuildSettings = \{.*?\n\t\t\t\};\n\t\t\tname = \1;",
              inject,
              text,
              flags=re.S,
          )
          if n == 0:
              raise SystemExit("failed to locate XCBuildConfiguration blocks")
          path.write_text(text2)
          print(f"patched {n} build configuration blocks")
          PY

      - name: Create ExportOptions.plist
        run: |
          cat > iOS/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PP_UUID}</string>
                  <key>${SHARE_BUNDLE_ID}</key>
                  <string>${SHARE_PP_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat iOS/ExportOptions.plist

      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iOS/ReSourcer.xcodeproj \
            -scheme ReSourcer \
            -configuration Release \
            -archivePath $RUNNER_TEMP/ReSourcer.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee /tmp/archive.log | tail -30

          if [ ! -d "$RUNNER_TEMP/ReSourcer.xcarchive" ]; then
            echo "Archive failed. Full log:"
            cat /tmp/archive.log
            exit 1
          fi

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/ReSourcer.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist iOS/ExportOptions.plist \
            2>&1 | tee /tmp/export.log | tail -20

          if [ ! -d "$RUNNER_TEMP/export" ]; then
            echo "Export failed. Full log:"
            cat /tmp/export.log
            exit 1
          fi

      - name: Prepare IPA
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA not found"
            ls -R $RUNNER_TEMP/export/
            exit 1
          fi
          cp "$IPA_PATH" ReSourcer.ipa
          echo "IPA size: $(du -h ReSourcer.ipa | cut -f1)"

      - name: Diagnose IPA
        run: |
          unzip -o ReSourcer.ipa -d "$RUNNER_TEMP/ipa_check" >/dev/null
          APP_DIR=$(find "$RUNNER_TEMP/ipa_check/Payload" -maxdepth 1 -name "*.app" -type d | head -n 1)

          echo "===== IPA 诊断 ====="
          echo "Version:     $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist" 2>/dev/null || echo '?') ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist" 2>/dev/null || echo '?'))"
          echo "Bundle ID:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Info.plist" 2>/dev/null || echo '?')"

          PP="$APP_DIR/embedded.mobileprovision"
          if [ ! -f "$PP" ]; then
            echo "::warning::未找到 embedded.mobileprovision,IPA 可能未正确签名"
          else
            PP_PLIST="$RUNNER_TEMP/pp.plist"
            security cms -D -i "$PP" > "$PP_PLIST"
            echo "Profile:     $(/usr/libexec/PlistBuddy -c 'Print :Name' "$PP_PLIST" 2>/dev/null || echo '?')"
            echo "Expiration:  $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PP_PLIST" 2>/dev/null || echo '?')"
          fi
          echo "===================="

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ReSourcer.ipa
          retention-days: 30

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::缺少 App Store Connect API 凭证 secret:ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8"
            exit 1
          fi
          # altool 会在 ~/private_keys 下按 AuthKey_<KEY_ID>.p8 查找私钥
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

          xcrun altool --upload-app --type ios \
            --file ReSourcer.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --output-format json 2>&1 | tee /tmp/altool.log

          if grep -q '"product-errors"' /tmp/altool.log; then
            echo "::error::TestFlight 上传失败,见上方日志"
            exit 1
          fi
          echo "已上传到 App Store Connect,处理完成后(约 5-15 分钟)会出现在 TestFlight 内部测试组"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf ~/private_keys || true
